name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build · Test · Lint · Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2

      # ── Build ──────────────────────────────────────────────
      - name: Build workspace
        run: cargo build --workspace

      # ── Test ───────────────────────────────────────────────
      - name: Run tests
        run: cargo test --workspace

      # ── Lint ───────────────────────────────────────────────
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Rustfmt
        run: cargo fmt --all -- --check

      # ── Generated grammar ──────────────────────────────────
      # `parser.c`, `grammar.json` and `node-types.json` are generated from
      # `grammar.js` and committed, because the editors build them from this
      # repository. Fail when they are stale. The version is the one
      # `just gen-treesitter` pins: another version writes different files.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: tree-sitter generated files are up to date
        run: |
          cd crates/tree-sitter-tomet
          sha256sum src/parser.c src/grammar.json src/node-types.json > $RUNNER_TEMP/tree-sitter.sum
          npx -y tree-sitter-cli@0.26.12 generate
          sha256sum --check $RUNNER_TEMP/tree-sitter.sum

      # ── Docs Check ────────────────────────────────────────
      # Verify .tmt documents: syntax, formatting, and export
      # consistency using the tomet binary built above.
      - name: tomet check
        continue-on-error: true
        run: ./target/debug/tomet check .

      - name: tomet format --check
        continue-on-error: true
        run: ./target/debug/tomet format --check .

      - name: tomet export --check
        continue-on-error: true
        run: ./target/debug/tomet export --check .

      - name: Verify tmtroot export config
        continue-on-error: true
        run: |
          stray=$(find tmtroot -name '*.tmt' -exec grep -L 'export:' {} +) || true
          if [ -n "$stray" ]; then
            echo "$stray" | while IFS= read -r f; do
              echo "::error file=$f::declares no @config(export:), so it produces nothing"
            done
            exit 1
          fi

  nix:
    name: Nix Build · Cachix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: tomet
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build tomet package
        run: nix build .#tomet

      - name: Build tomet-lsp package
        run: nix build .#tomet-lsp
