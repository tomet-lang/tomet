name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build · Test · Lint · Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2

      # ── Build ──────────────────────────────────────────────
      - name: Build workspace
        run: cargo build --workspace --exclude tomet-web

      # ── Test ───────────────────────────────────────────────
      - name: Run tests
        run: cargo test --workspace --exclude tomet-web

      # ── Lint ───────────────────────────────────────────────
      - name: Clippy
        run: cargo clippy --workspace --exclude tomet-web --all-targets

      - name: Rustfmt
        run: cargo fmt --all -- --check

      # ── Docs Check ────────────────────────────────────────
      # Verify .tmt documents: syntax, formatting, and export
      # consistency using the tomet binary built above.
      - name: tomet check
        continue-on-error: true
        run: ./target/debug/tomet check .

      - name: tomet format --check
        continue-on-error: true
        run: ./target/debug/tomet format --check .

      - name: tomet export --check
        continue-on-error: true
        run: ./target/debug/tomet export --check .

      - name: Verify tmtroot export config
        continue-on-error: true
        run: |
          stray=$(find tmtroot -name '*.tmt' -exec grep -L 'export:' {} +) || true
          if [ -n "$stray" ]; then
            echo "$stray" | while IFS= read -r f; do
              echo "::error file=$f::declares no @config(export:), so it produces nothing"
            done
            exit 1
          fi
