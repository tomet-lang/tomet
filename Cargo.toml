[workspace]
resolver = "3"

members = [
  #[ CLI & Web ]
  "apps/cli",
  "apps/web",
  "apps/lsp",

  #[ Bindings ]
  "bindings/java",
  "bindings/js",
  "bindings/python",

  #[ Editor Support ]
  "editors/zed",
  "editors/neovim",
  "editors/helix",

  #[ Syntax -- grammar/parsing ]
  "crates/tomet-syntax-cst",
  "crates/tomet-syntax-ast",
  "crates/tomet-syntax-lexar",
  "crates/tomet-syntax-parser",

  #[ Semantics -- classification/validation ]
  "crates/tomet-semantics",
  "crates/tomet-semantics-validator",

  #[ Doc -- whole-Document/workspace operations ]
  "crates/tomet-doc-walker",
  "crates/tomet-doc-resolver",
  "crates/tomet-doc-compute",
  "crates/tomet-doc-config",
  "crates/tomet-doc-edit",
  "crates/tomet-doc-indexer",
  "crates/tomet-doc-links",

  #[ Codegen -- conversion to/from external formats ]
  "crates/tomet-codegen-markdown",
  "crates/tomet-codegen-html",

  #[ Emit -- .tmt text production ]
  "crates/tomet-emit-field-utils",
  "crates/tomet-emit-style",
  "crates/tomet-emit-printer",
  "crates/tomet-emit-formatter",

  #[ Public -- external ecosystem adapters ]
  "crates/serde_tomet",
  "crates/tree-sitter-tomet",

  #[ Apps ]
  "apps/tui",
]

default-members = ["apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
#[ Syntax ]
tomet-cst = { path = "crates/tomet-syntax-cst" }
tomet-ast = { path = "crates/tomet-syntax-ast" }
tomet-lexar = { path = "crates/tomet-syntax-lexar" }
tomet-parser = { path = "crates/tomet-syntax-parser" }
#[ Semantics ]
tomet-semantics = { path = "crates/tomet-semantics" }
tomet-validator = { path = "crates/tomet-semantics-validator" }
#[ Doc ]
tomet-walker = { path = "crates/tomet-doc-walker" }
tomet-resolver = { path = "crates/tomet-doc-resolver" }
tomet-compute = { path = "crates/tomet-doc-compute" }
tomet-config = { path = "crates/tomet-doc-config" }
tomet-edit = { path = "crates/tomet-doc-edit" }
tomet-indexer = { path = "crates/tomet-doc-indexer" }
tomet-links = { path = "crates/tomet-doc-links" }
#[ Codegen ]
tomet-markdown = { path = "crates/tomet-codegen-markdown" }
tomet-html = { path = "crates/tomet-codegen-html" }
#[ Emit ]
tomet-field-utils = { path = "crates/tomet-emit-field-utils" }
tomet-style = { path = "crates/tomet-emit-style" }
tomet-printer = { path = "crates/tomet-emit-printer" }
tomet-formatter = { path = "crates/tomet-emit-formatter" }
#[ Public ]
serde_tomet = { path = "crates/serde_tomet" }
tree-sitter-tomet = { path = "crates/tree-sitter-tomet" }
#[ Apps ]
tomet-tui = { path = "apps/tui" }

#[ Crates.io ]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
clap = { version = "4.6", features = ["derive"] }
cxx = "1"
crossterm = "0.28"
directories = "6.0"
ignore = "0.4"
lsp-server = "0.10"
lsp-types = "0.97"
pulldown-cmark = "0.13"
ratatui = "0.29"
rayon = "1"
regex = "1.12"
rowan = "0.16"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
time = "0.3"
tokio = "1"
toml = { version = "0.9", features = ["preserve_order"] }
tree-sitter = "0.26"
tree-sitter-language = "0.1"
nanoid = "0.4"
uuid = { version = "1.23", features = ["v4"] }
walkdir = "2"
zed_extension_api = "0.7"
