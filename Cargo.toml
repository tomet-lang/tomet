[workspace]
resolver = "3"

members = [
  "apps/typedmark-rs",
  "crates/tree-sitter-typedmark",
  "crates/typedmark-ast",
  "crates/typedmark-formatter",
  "crates/typedmark-lsp",
  "crates/typedmark-parser",
  "crates/typedmark-renderer",
  "crates/typedmark-validator"
]

default-members = [
  "apps/typedmark-rs"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
cxx = "1"
directories = "6.0"
rayon = "1"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
time = "0.3"
tokio = "1"
uuid = { version = "1.23", features = ["v4"] }
walkdir = "2"
