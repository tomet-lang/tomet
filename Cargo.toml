[workspace]
resolver = "3"

members = [
  #[ CLI & Web ]
  "apps/cli",
  "apps/web",
  "apps/lsp",

  #[ Bindings ]
  "bindings/java",
  "bindings/js",
  "bindings/python",

  #[ Editor Support ]
  "editors/zed",

  #[ Syntax -- grammar/parsing ]
  "crates/tomet-syntax-cst",
  "crates/tomet-syntax-ast",
  "crates/tomet-syntax-tree",
  "crates/tomet-syntax-lexer",
  "crates/tomet-syntax-parser",

  #[ Semantics -- classification/validation/eval/resolve ]
  "crates/tomet-semantics",
  "crates/tomet-semantics-validator",
  "crates/tomet-semantics-compute",
  "crates/tomet-semantics-resolver",

  #[ Transform -- in-memory AST transformations & macros ]
  "crates/tomet-transform",

  #[ Convert -- conversion to/from external document formats ]
  "crates/tomet-convert-markdown",
  "crates/tomet-convert-html",
  "crates/tomet-convert-typst",

  #[ Format -- .tmt source text production & formatting ]
  "crates/tomet-formatter",
  "crates/tomet-format-field-utils",
  "crates/tomet-format-style",
  "crates/tomet-format-printer",

  #[ Workspace -- multi-file/disk operations & config discovery ]
  "crates/tomet-workspace",
  "crates/tomet-workspace-indexer",
  "crates/tomet-workspace-links",
  "crates/tomet-workspace-config",

  #[ Public -- external ecosystem adapters ]
  "crates/serde_tomet",
  "crates/tree-sitter-tomet",

  #[ Apps ]
  "apps/tui",

  #[ Tests -- cross-crate corpus, round-trip, and snapshot suites ]
  "tests",
]

default-members = ["apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
#[ Syntax ]
tomet-cst = { path = "crates/tomet-syntax-cst" }
tomet-ast = { path = "crates/tomet-syntax-ast" }
tomet-tree = { path = "crates/tomet-syntax-tree" }
tomet-lexer = { path = "crates/tomet-syntax-lexer" }
tomet-parser = { path = "crates/tomet-syntax-parser" }
#[ Semantics ]
tomet-semantics = { path = "crates/tomet-semantics" }
tomet-validator = { path = "crates/tomet-semantics-validator" }
tomet-compute = { path = "crates/tomet-semantics-compute" }
tomet-resolver = { path = "crates/tomet-semantics-resolver" }
#[ Transform ]
tomet-transform = { path = "crates/tomet-transform" }
#[ Convert ]
tomet-markdown = { path = "crates/tomet-convert-markdown" }
tomet-html = { path = "crates/tomet-convert-html" }
tomet-typst = { path = "crates/tomet-convert-typst" }
#[ Format ]
tomet-field-utils = { path = "crates/tomet-format-field-utils" }
tomet-style = { path = "crates/tomet-format-style" }
tomet-printer = { path = "crates/tomet-format-printer" }
tomet-formatter = { path = "crates/tomet-formatter" }
#[ Workspace ]
tomet-workspace = { path = "crates/tomet-workspace" }
tomet-indexer = { path = "crates/tomet-workspace-indexer" }
tomet-links = { path = "crates/tomet-workspace-links" }
tomet-config = { path = "crates/tomet-workspace-config" }
#[ Public ]
serde_tomet = { path = "crates/serde_tomet" }
tree-sitter-tomet = { path = "crates/tree-sitter-tomet" }
#[ Apps ]
tomet-tui = { path = "apps/tui" }

#[ Crates.io ]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
clap = { version = "4.6", features = ["derive"] }
cxx = "1"
crossterm = "0.28"
directories = "6.0"
ignore = "0.4"
jni = "0.21"
js-sys = "=0.3.98"
lsp-server = "0.10"
lsp-types = "0.97"
pulldown-cmark = "0.13"
pyo3 = { version = "0.23", features = ["serde"] }
pythonize = "0.23"
ratatui = "0.29"
rayon = "1"
regex = "1.12"
rowan = "0.16"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-wasm-bindgen = "0.6"
serde_yaml = "0.9"
time = "0.3"
tokio = "1"
toml = { version = "0.9", features = ["preserve_order"] }
tree-sitter = "0.26"
tree-sitter-language = "0.1"
nanoid = "0.4"
unicode-width = "0.2"
uuid = { version = "1.23", features = ["v4", "js"] }
walkdir = "2"
wasm-bindgen = "=0.2.121"
zed_extension_api = "0.7"
