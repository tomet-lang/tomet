[workspace]
resolver = "3"

members = [
  #[ CLI & Web ]
  "apps/cli",
  "apps/web",
  "apps/lsp",

  #[ Bindings ]
  "bindings/java",
  "bindings/js",
  "bindings/python",

  #[ Editor Support ]
  "editors/zed",
  "editors/neovim",
  "editors/helix",

  #[ Syntax -- grammar/parsing ]
  "crates/typedmark-syntax-ast",
  "crates/typedmark-syntax-lexar",
  "crates/typedmark-syntax-parser",

  #[ Semantics -- classification/validation ]
  "crates/typedmark-semantics",
  "crates/typedmark-semantics-validator",

  #[ Doc -- whole-Document/workspace operations ]
  "crates/typedmark-doc-walker",
  "crates/typedmark-doc-resolver",
  "crates/typedmark-doc-compute",
  "crates/typedmark-doc-config",
  "crates/typedmark-doc-edit",
  "crates/typedmark-doc-indexer",

  #[ Codegen -- conversion to/from external formats ]
  "crates/typedmark-codegen-markdown",
  "crates/typedmark-codegen-html",

  #[ Emit -- .tm text production ]
  "crates/typedmark-emit-field-utils",
  "crates/typedmark-emit-style",
  "crates/typedmark-emit-printer",
  "crates/typedmark-emit-formatter",

  #[ Public -- external ecosystem adapters ]
  "crates/serde_typedmark",
  "crates/tree-sitter-typedmark",

  #[ Apps ]
  "apps/tui",
]

default-members = ["apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
#[ Syntax ]
typedmark-ast = { path = "crates/typedmark-syntax-ast" }
typedmark-lexar = { path = "crates/typedmark-syntax-lexar" }
typedmark-parser = { path = "crates/typedmark-syntax-parser" }
#[ Semantics ]
typedmark-semantics = { path = "crates/typedmark-semantics" }
typedmark-validator = { path = "crates/typedmark-semantics-validator" }
#[ Doc ]
typedmark-walker = { path = "crates/typedmark-doc-walker" }
typedmark-resolver = { path = "crates/typedmark-doc-resolver" }
typedmark-compute = { path = "crates/typedmark-doc-compute" }
typedmark-config = { path = "crates/typedmark-doc-config" }
typedmark-edit = { path = "crates/typedmark-doc-edit" }
typedmark-indexer = { path = "crates/typedmark-doc-indexer" }
#[ Codegen ]
typedmark-markdown = { path = "crates/typedmark-codegen-markdown" }
typedmark-html = { path = "crates/typedmark-codegen-html" }
#[ Emit ]
typedmark-field-utils = { path = "crates/typedmark-emit-field-utils" }
typedmark-style = { path = "crates/typedmark-emit-style" }
typedmark-printer = { path = "crates/typedmark-emit-printer" }
typedmark-formatter = { path = "crates/typedmark-emit-formatter" }
#[ Public ]
serde_typedmark = { path = "crates/serde_typedmark" }
tree-sitter-typedmark = { path = "crates/tree-sitter-typedmark" }
#[ Apps ]
typedmark-tui = { path = "apps/tui" }

#[ Crates.io ]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
clap = { version = "4.6", features = ["derive"] }
cxx = "1"
crossterm = "0.28"
directories = "6.0"
ignore = "0.4"
lsp-server = "0.10"
lsp-types = "0.97"
pulldown-cmark = "0.13"
ratatui = "0.29"
rayon = "1"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
time = "0.3"
tokio = "1"
toml = { version = "0.9", features = ["preserve_order"] }
tree-sitter = "0.26"
tree-sitter-language = "0.1"
nanoid = "0.4"
uuid = { version = "1.23", features = ["v4"] }
walkdir = "2"
zed_extension_api = "0.7"
