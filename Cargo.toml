[workspace]
resolver = "3"

members = [
  #= CLI
  "apps/cli",
  "apps/lsp",

  #= Apps
  "apps/tui",

  #= Bindings
  "bindings/java",
  "bindings/js",
  "bindings/python",

  #= Editor Support
  "editors/zed",

  #= Facade -- the one crate a Rust consumer depends on
  "crates/tomet",

  #= Public -- external ecosystem adapters
  "crates/tove",
  "crates/tree-sitter-tomet",

  #= Syntax -- grammar/parsing
  "crates/tomet-syntax-cst",
  "crates/tomet-syntax-ast",
  "crates/tomet-syntax-tree",
  "crates/tomet-syntax-lexer",
  "crates/tomet-syntax-parser",

  #= Semantics -- classification/validation/eval/resolve
  "crates/tomet-semantics",
  "crates/tomet-semantics-validator",
  "crates/tomet-semantics-compute",
  "crates/tomet-semantics-address",

  #= Config -- PrinterConfig discovery & loading; the producers sit on this
  "crates/tomet-config",

  #= Load -- the front door: config + vocabularies + parse + bind
  "crates/tomet-load",
  "crates/tomet-load-config",

  #= Transform -- in-memory AST transformations & macros
  "crates/tomet-transform",

  #= Search -- in-memory structural search & filter queries
  "crates/tomet-search",

  #= Edit -- backend-neutral editable model for collaborative editing
  "crates/tomet-edit",

  #= Stats -- pure in-memory document statistics & metrics
  "crates/tomet-stats",

  #= Vault -- a vault's config and vocabularies, no disk
  "crates/tomet-vault",

  #= Convert -- conversion to/from external document formats
  "crates/tomet-convert-markdown",
  "crates/tomet-convert-html",
  "crates/tomet-convert-typst",
  "crates/tomet-convert-pandoc",

  #= Extract -- extraction of tomet from external source files / comments
  "crates/tomet-extract",
  "crates/tomet-extract-rust",

  #= Format -- .tmt source text production & formatting
  "crates/tomet-format",
  "crates/tomet-format-field-utils",
  "crates/tomet-format-style",
  "crates/tomet-format-printer",

  #= Workspace -- multi-file/disk operations & config discovery
  "crates/tomet-workspace",
  "crates/tomet-workspace-indexer",
  "crates/tomet-workspace-links",
  "crates/tomet-config",
  "crates/tomet-load",

  #= Tests -- cross-crate corpus, round-trip, and snapshot suites
  "tests",
]

default-members = ["apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tomet-lang/tomet"

[workspace.dependencies]
#= Syntax
tomet-ast = { path = "crates/tomet-syntax-ast", version = "0.1.0" }
tomet-cst = { path = "crates/tomet-syntax-cst", version = "0.1.0" }
tomet-lexer = { path = "crates/tomet-syntax-lexer", version = "0.1.0" }
tomet-parser = { path = "crates/tomet-syntax-parser", version = "0.1.0" }
tomet-tree = { path = "crates/tomet-syntax-tree", version = "0.1.0" }
#= Semantics
tomet-address = { path = "crates/tomet-semantics-address", version = "0.1.0" }
tomet-compute = { path = "crates/tomet-semantics-compute", version = "0.1.0" }
tomet-semantics = { path = "crates/tomet-semantics", version = "0.1.0" }
tomet-validator = { path = "crates/tomet-semantics-validator", version = "0.1.0" }
#= Transform
tomet-transform = { path = "crates/tomet-transform", version = "0.1.0" }
#= Search
tomet-search = { path = "crates/tomet-search", version = "0.1.0" }
#= Edit
tomet-edit = { path = "crates/tomet-edit", version = "0.1.0" }
#= Stats
tomet-stats = { path = "crates/tomet-stats", version = "0.1.0" }
#= Vault
tomet-vault = { path = "crates/tomet-vault", version = "0.1.0" }
#= Convert
tomet-html = { path = "crates/tomet-convert-html", version = "0.1.0" }
tomet-markdown = { path = "crates/tomet-convert-markdown", version = "0.1.0" }
tomet-pandoc = { path = "crates/tomet-convert-pandoc", version = "0.1.0" }
tomet-typst = { path = "crates/tomet-convert-typst", version = "0.1.0" }
#= Extract
tomet-extract = { path = "crates/tomet-extract", version = "0.1.0" }
tomet-extract-rust = { path = "crates/tomet-extract-rust", version = "0.1.0" }
#= Format
tomet-field-utils = { path = "crates/tomet-format-field-utils", version = "0.1.0" }
tomet-formatter = { path = "crates/tomet-format", version = "0.1.0" }
tomet-printer = { path = "crates/tomet-format-printer", version = "0.1.0" }
tomet-style = { path = "crates/tomet-format-style", version = "0.1.0" }
#= Workspace
tomet-config = { path = "crates/tomet-config", version = "0.1.0" }
tomet-indexer = { path = "crates/tomet-workspace-indexer", version = "0.1.0" }
tomet-links = { path = "crates/tomet-workspace-links", version = "0.1.0" }
tomet-load = { path = "crates/tomet-load", version = "0.1.0" }
tomet-load-config = { path = "crates/tomet-load-config", version = "0.1.0" }
tomet-workspace = { path = "crates/tomet-workspace", version = "0.1.0" }
#= Public
tove = { path = "crates/tove", version = "0.1.0" }
tree-sitter-tomet = { path = "crates/tree-sitter-tomet", version = "0.1.0" }
#= Facade
tomet = { path = "crates/tomet", version = "0.1.0" }
#= Apps
tomet-tui = { path = "apps/tui" }

#= Crates.io
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.28"
cxx = "1"
directories = "6.0"
ignore = "0.4"
jni = "0.21"
js-sys = "0.3"
lsp-server = "0.10"
lsp-types = "0.97"
nanoid = "0.4"
pulldown-cmark = "0.13"
pyo3 = { version = "0.23", features = ["serde"] }
pythonize = "0.23"
ratatui = "0.29"
rayon = "1"
regex = "1.12"
rowan = "0.16"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-wasm-bindgen = "0.6"
serde_yaml = "0.9"
syn = { version = "2.0", features = ["full", "visit"] }
time = "0.3"
tokio = "1"
toml = { version = "0.9", features = ["preserve_order"] }
tree-sitter = "0.26"
tree-sitter-language = "0.1"
unicode-width = "0.2"
uuid = { version = "1.23", features = ["v4", "js"] }
walkdir = "2"
wasm-bindgen = "=0.2.127"
zed_extension_api = "0.7"

[profile.dev.package."*"]
opt-level = 3
