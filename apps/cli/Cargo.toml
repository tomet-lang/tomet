[package]
name = "tomet-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface and developer tools for the Tomet toolchain."
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tomet"
path = "src/main.rs"

[dependencies]
tomet-ast = { workspace = true }
tomet-compute = { workspace = true }
tomet-config = { workspace = true }
tomet-extract-rust = { workspace = true }
tomet-formatter = { workspace = true }
tomet-html = { workspace = true }
tomet-indexer = { workspace = true }
tomet-links = { workspace = true }
tomet-load = { workspace = true }
tomet-markdown = { workspace = true }
tomet-pandoc = { workspace = true }
tomet-parser = { workspace = true }
tomet-printer = { workspace = true }
tomet-resolver = { workspace = true }
tomet-semantics = { workspace = true }
tomet-stats = { workspace = true }
tomet-tree = { workspace = true }
tomet-tui = { workspace = true }
tomet-typst = { workspace = true }
tomet-validator = { workspace = true }
tomet-workspace = { workspace = true }
tove = { workspace = true }

#= Crates.io
anyhow = { workspace = true }
axum = { workspace = true, features = ["json"] }
clap = { workspace = true }
nanoid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
toml = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
