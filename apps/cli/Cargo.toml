[package]
name = "tomet"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tomet"
path = "src/main.rs"

[dependencies]
serde_tomet = { workspace = true }
tomet-ast = { workspace = true }
tomet-config = { workspace = true }
tomet-formatter = { workspace = true }
tomet-indexer = { workspace = true }
tomet-links = { workspace = true }
tomet-markdown = { workspace = true }
tomet-parser = { workspace = true }
tomet-printer = { workspace = true }
tomet-html = { workspace = true }
tomet-typst = { workspace = true }
tomet-semantics = { workspace = true }
tomet-tui = { workspace = true }
tomet-workspace = { workspace = true }

#[ Crates.io ]
anyhow = { workspace = true }
axum = { workspace = true, features = ["json"] }
clap = { workspace = true }
nanoid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
uuid = { workspace = true }
walkdir = { workspace = true }
