[package]
name = "typedmark"
version.workspace = true
edition.workspace = true

[[bin]]
name = "typedmark"
path = "src/main.rs"

[dependencies]
serde_typedmark = { workspace = true }
typedmark-ast = { workspace = true }
typedmark-formatter = { workspace = true }
typedmark-indexer = { workspace = true }
typedmark-markdown = { workspace = true }
typedmark-parser = { workspace = true }
typedmark-html = { workspace = true }
typedmark-semantics = { workspace = true }
typedmark-tui = { workspace = true }

#[ Crates.io ]
anyhow = { workspace = true }
axum = { workspace = true, features = ["json"] }
clap = { workspace = true }
nanoid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
uuid = { workspace = true }
walkdir = { workspace = true }
