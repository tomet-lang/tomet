[package]
name = "tomet-web"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tomet-web"
path = "src/main.rs"

[dependencies]
tomet-formatter = { workspace = true }
tomet-markdown = { workspace = true }
tomet-parser = { workspace = true }
tomet-html = { workspace = true }
tomet-typst = { workspace = true }
tomet-validator = { workspace = true }
tomet-ast = { workspace = true }

#[ Crates.io ]
anyhow = { workspace = true }
axum = { workspace = true, features = ["json"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
