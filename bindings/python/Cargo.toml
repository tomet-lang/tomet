[package]
name = "tomet-python"
version.workspace = true
edition.workspace = true

[lib]
name = "tomet"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
# The facade's package is `tomet`, which is also this library's own name,
# so the dependency is renamed.
tomet-crate = { package = "tomet", path = "../../crates/tomet", features = ["html", "markdown", "typst", "format", "printer"] }

pyo3 = { workspace = true, features = ["auto-initialize"] }
pythonize = { workspace = true }
serde = { workspace = true }
