[package]
name = "tomet-python"
version.workspace = true
edition.workspace = true

[lib]
name = "tomet"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
tomet-ast = { workspace = true }
tomet-parser = { workspace = true }
tomet-html = { workspace = true }
tomet-markdown = { workspace = true }
tomet-formatter = { workspace = true }
tomet-printer = { workspace = true }
tomet-validator = { workspace = true }

pyo3 = { workspace = true, features = ["auto-initialize"] }
pythonize = { workspace = true }
serde = { workspace = true }
