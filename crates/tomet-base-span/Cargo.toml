[package]
name                 = "tomet-span"
version.workspace    = true
edition.workspace    = true
description          = "Source span representations (byte offsets) for the Tomet toolchain."
license.workspace    = true
repository.workspace = true

[dependencies]
#--- Crates.io ---
serde = { workspace = true }
schemars = { workspace = true, optional = true }

[features]
# `JsonSchema` for the wire shape of a span, for the generated schema of the AST (`tomet spec ast-schema`).
schema = ["dep:schemars"]
