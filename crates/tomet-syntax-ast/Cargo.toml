[package]
name                 = "tomet-ast"
version.workspace    = true
edition.workspace    = true
description          = "Shared AST and Value data models for the Tomet toolchain."
license.workspace    = true
repository.workspace = true

[dependencies]
tomet-scalar   = { workspace = true }
tomet-span     = { workspace = true }
tomet-spelling = { workspace = true }
#--- Crates.io ---
serde         = { workspace = true }
schemars      = { workspace = true, optional = true }
unicode-width = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
# `JsonSchema` for every type of the AST wire (and the plain-data form), for the schema generated
# by `tomet spec ast-schema`. Off by default: nothing that parses or prints needs it.
schema = ["dep:schemars", "tomet-scalar/schema", "tomet-span/schema"]
