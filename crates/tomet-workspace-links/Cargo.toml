[package]
name = "tomet-links"
version.workspace = true
edition.workspace = true
description = "Vault-wide link target resolution for Tomet, and (with the `cache` feature) broken-link detection with a SQLite-backed mtime cache."
license.workspace = true
repository.workspace = true

[features]
default = ["cache"]
# The SQLite incremental link cache and the vault-wide link check built on it.
# Off, this crate is just link resolution and collection: no SQLite, no
# user-cache directory lookup.
cache = ["dep:directories", "dep:rusqlite"]

[dependencies]
tomet-address = { workspace = true }
tomet-ast = { workspace = true }
tomet-config = { workspace = true }
tomet-indexer = { workspace = true }
tomet-parser = { workspace = true }
tomet-semantics = { workspace = true }
tomet-tree = { workspace = true }

#= Crates.io
directories = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
uuid = { workspace = true }
