[package]
name = "tomet-tests"
version.workspace = true
edition.workspace = true
publish = false

# Test targets live in `src/` and are declared explicitly, so this package
# does not need a `tests/tests/` directory. Auto-discovery is off so the
# fixture/ref/store data directories are never mistaken for targets.
autotests = false
autobins = false
autoexamples = false
autobenches = false

[lib]
path = "src/lib.rs"

[[test]]
name = "corpus"
path = "src/corpus.rs"

[[test]]
name = "roundtrip"
path = "src/roundtrip.rs"

[[test]]
name = "snapshot"
path = "src/snapshot.rs"

[[test]]
name = "blueprint"
path = "src/blueprint.rs"

[[test]]
name = "vocabulary"
path = "src/vocabulary.rs"

[[test]]
name = "syntax_report"
path = "src/syntax_report.rs"

[dependencies]
tomet-ast = { workspace = true }
tomet-compute = { workspace = true }
tomet-config = { workspace = true }
tomet-formatter = { workspace = true }
tomet-html = { workspace = true }
tomet-markdown = { workspace = true }
tomet-parser = { workspace = true }
tomet-printer = { workspace = true }
tomet-transform = { workspace = true }
tomet-tree = { workspace = true }
tomet-typst = { workspace = true }
tomet-validator = { workspace = true }
tomet-workspace = { workspace = true }
tree-sitter-tomet = { workspace = true }
tree-sitter = { workspace = true }
