<h1>値位置のブロック内容</h1>
<p><code>key: [...]</code> は <code>(args)</code>/<code>{value}</code> のどんなキーでも書ける。要素自身の <code>[content]</code> と同じ再帰ブロック文法なので、複数段落や見出し、ネストした要素も入る -- 1段落だけなら <code>[content]</code> と同じく単純なインライン文として印字される。</p>
