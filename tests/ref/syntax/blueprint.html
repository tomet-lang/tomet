<h1>三つのスロット</h1>
<p>識別子は <code>blueprint</code>、入力は生成物の kind、データは雛形自身についての情報。位置引数は <code>target</code> に正規化される。<code>kind</code> ではない——すぐ上の <code>@kind</code> と二行のうちに二度出て、別のものを指すことになるので。</p>
<h1>生成物ではない</h1>
<p>このファイルは memo ではなく、memo の定義。<code>@kind()</code> で memo を探してもここは出てこない。実体化のとき <code>@blueprint(memo)</code> が <code>@kind(memo)</code> に昇格する。</p>
