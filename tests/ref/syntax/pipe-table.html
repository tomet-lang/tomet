<h1><code>|</code> はセルの区切りではなく内容の左端</h1>
<p>外側の <code>[</code> と閉じ <code>]</code> が消え、行の頭に縦の列が立つ。セルは <code>[cell][cell]</code> のままなので、Markdown のようにセルを <code>|</code> で割ることはしない。</p>
<table class="tm-element tm-table">
<thead>
<tr>
<th>糖衣</th>
<th>要素</th>
</tr>
</thead>
<tbody>
<tr>
<td>ul</td>
<td>順序なし</td>
</tr>
<tr>
<td>ol</td>
<td>順序つき</td>
</tr>
</tbody>
</table>
