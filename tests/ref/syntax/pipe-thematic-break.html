<h1>題つき区切り線の <code>|</code> 形</h1>
<p><code>---[ 題 ]---</code> の <code>[ 題 ]</code> は、<code>|</code> 行でも書ける。<code>]---</code> の代わりに、閉じの <code>---</code> が次の行に要る。</p>
