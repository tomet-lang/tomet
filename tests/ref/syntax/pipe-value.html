<h1>値位置の <code>|</code></h1>
<p><code>key: | ...</code> は <code>key: [ ... ]</code> の括弧のない形で、<code>|</code> 行の連なりの終わりで閉じる。要素自身の <code>|content</code> と同じ文法なので、散文の中の <code>,</code> や <code>}</code> では値は終わらず、続く行が <code>|</code> で始まらなければ、それが次のキーになる。</p>
