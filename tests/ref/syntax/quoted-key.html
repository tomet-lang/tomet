<h1>Quoted map keys</h1>
<p>A key that is not an identifier is written as a quoted string.</p>
<div class="tm-element tm-ns.thing" data-plain="2" data-tomet-data="{&quot;args&quot;:{&quot;a/b.tmt&quot;:1,&quot;plain&quot;:2}}"></div>
<div class="tm-element tm-ns.thing" data-tomet-data="{&quot;args&quot;:{&quot;a/b&quot;:{&quot;c d&quot;:3}}}"></div>
<p>A quoted string with no <code>:</code> after it is still a value, not a key.</p>
<div class="tm-element tm-ns.thing" data-value="a/b.tmt"></div>
