<h1>シジルは形を表す</h1>
<p>`@` はインライン、`#` はブロック。名前空間が出自を表す。</p>
<h1>ブロック要素</h1>
<div class="tm-element tm-memo">名前は `#` の直後に続く。空白があると本文になる</div>
<div class="tm-element tm-deck.bookmark" data-name="foo" data-count="3">名前空間つき</div>
<h1>インライン要素</h1>
<p>文中の <a class="tm-url" href="https://example.com">リンク</a> と <span class="tm-element tm-deck.badge" data-value="2">名前空間つきインライン</span> は行の途中でも要素になる。</p>
<h1>本文に落ちる `#`</h1>
<p># 見出しではない行。`#` の直後が識別子でなければただの文字。</p>
<p>これは #タグ ではない。ASCII でない名前は要素にならない。</p>
<h1>`{}` は常にデータ</h1>
