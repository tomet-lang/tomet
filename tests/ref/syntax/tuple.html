<p>A call takes named and unnamed entries together.</p>
<div class="tm-element tm-item" data-tomet-data="{&quot;args&quot;:{&quot;icon&quot;:{&quot;call&quot;:&quot;glyph&quot;,&quot;args&quot;:{&quot;0&quot;:&quot;triangle&quot;,&quot;pkg&quot;:&quot;lucide&quot;}},&quot;use&quot;:{&quot;call&quot;:&quot;vocab&quot;,&quot;args&quot;:{&quot;0&quot;:&quot;a&quot;,&quot;version&quot;:3}}}}"></div>
