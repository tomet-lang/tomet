<h1>値の中の要素</h1>
<p><code>@</code>付きの要素は <code>(args)</code>/<code>{value}</code>/<code>[...]</code> のどこでも値として書ける(上の <code>@meta</code> を参照)。裸の <code>list(...)</code>/<code>enum(...)</code> 呼び出し(評価されないデータ)とは違い、本物の要素として分類・検証される。</p>
<h1>位置引数と名前付き引数の混在</h1>
<p>クォート付きの位置引数は、先頭でもそれ以外の位置でも同じ文字列として読める (<code>@meta</code> の <code>mixed</code> を参照)。これは要素をvalueに埋め込む機能とは独立のパーサ修正で、<code>(args)</code> 一般に効く。</p>
